version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errname
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
  disable:
    - err113

  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        hugeParam:
          # Identity-carrying protocol values (AssignmentKey, Schema,
          # Assignment, artifact.Ref) are 80-120 bytes of string headers and
          # are passed by value on purpose so a callee cannot mutate the
          # caller's copy. Only genuinely large values are worth a pointer.
          sizeThreshold: 128
    gocyclo:
      min-complexity: 40
    nakedret:
      max-func-lines: 30
    gosec:
      excludes:
        - G104

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - goconst
          - gocritic
          - unparam
          - prealloc
          - gocyclo
      # Conformance harnesses are test code compiled into non-_test files so
      # adapters can import them; they get the test exclusions.
      - path: ^(agent/artifact/artifacttest|agent/session/run/runtimetest|agent/session/sessiontest|agent/turn/turntest|provider/providertest)/
        linters:
          - errcheck
          - gosec
          - goconst
          - gocritic
          - unparam
          - gocyclo
          - prealloc
      # The SDK keeps its own text-generation layer building and tested while
      # callers move to the single-call seam, so a deprecation notice is not
      # actionable in the layer's own files or in the tests that pin it.
      - path: _test\.go
        text: SA1019
        linters:
          - staticcheck
      - path: ^sdk/(client|generate|generate_text|options|request_adapter|step_helpers|stream|stream_text)\.go$
        text: SA1019
        linters:
          - staticcheck

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
