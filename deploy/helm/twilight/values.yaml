image:
  repository: twilight
  tag: dev
  pullPolicy: Never

# /metrics is always served on each binary's HTTP port. These settings only
# configure discovery; they do not install Prometheus or expose a new Service.
metrics:
  # Requires an existing Prometheus job that honors prometheus.io annotations.
  scrapeAnnotations: false

podMonitor:
  # Requires an existing Prometheus Operator and monitoring.coreos.com CRDs.
  enabled: false
  # Match the existing Prometheus podMonitorSelector, e.g. release: monitoring.
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

# Optional catalog override; credentials are still named Secret files, not values.
# Empty keeps the bundled catalog. Useful for a validation mock or model gateway.
models: []

secrets:
  # Create this Secret outside Helm. It contains postgres-password,
  # postgres-dsn and OPENAI_API_KEY.
  existingSecret: twilight-secrets

agentSandbox:
  enabled: true
  warmPool: twilight-sandbox-pool
  image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd:latest-main
  replicas: 1
  # Agent Sandbox does not provide snapshot/restore, so keep turn snapshots off.
  snapshotAfterTurn: false

postgres:
  image: postgres:18-alpine
  storage: 5Gi
  database: twilight
  username: twilight
  passwordKey: postgres-password

recovery:
  # Redispatch can repeat an external side effect after its backend loses
  # process-local state. Keep the safe compatibility policy unless every
  # configured effect is idempotent or otherwise safe to retry.
  missingEffects: dispose
  maxRedispatches: 3
  redispatchRetry: 1s
  orphanProbe: 15s

# Every workload role gets its own k3d agent node. The matching taint is
# applied when the cluster is created, so unrelated pods stay away too.
placement:
  owner: owner
  executor: executor
  backend: backend
  store: store
  sandbox: sandbox

services:
  owner:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  modelBackend:
    replicas: 1
    # Optional separate credential Secret mounted only in model-backend.
    # It must contain REAL_MODEL_API_KEY; the shared DB Secret is unchanged.
    providerSecret: ""
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  toolBackend:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
