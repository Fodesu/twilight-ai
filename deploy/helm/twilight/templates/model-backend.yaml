apiVersion: v1
kind: Service
metadata:
  name: model-backend
  labels:
    {{- include "twilight.labels" (dict "name" "model-backend" "Release" .Release) | nindent 4 }}
spec:
  selector:
    {{- include "twilight.selectorLabels" (dict "name" "model-backend") | nindent 4 }}
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-backend
  labels:
    {{- include "twilight.labels" (dict "name" "model-backend" "Release" .Release) | nindent 4 }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.services.modelBackend.replicas }}
  selector:
    matchLabels:
      {{- include "twilight.selectorLabels" (dict "name" "model-backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twilight.selectorLabels" (dict "name" "model-backend") | nindent 8 }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- $catalogChecksum := printf "%s%s" (.Files.Get "config/models.json") (toJson .Values.models) | sha256sum }}
      {{- include "twilight.metricsAnnotations" (dict "Values" .Values "port" 8082 "extraAnnotations" (dict "checksum/models" $catalogChecksum)) | nindent 6 }}
    spec:
      securityContext:
        fsGroup: 10001
      nodeSelector:
        twilight.io/role: {{ .Values.placement.backend | quote }}
      tolerations:
        - key: twilight.io/role
          operator: Equal
          value: {{ .Values.placement.backend | quote }}
          effect: NoSchedule
      containers:
        - name: model-backend
          image: {{ include "twilight.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/model-backend", "-config", "/etc/twilight/config/model-backend.json"]
          env:
            {{- include "twilight.identityEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.services.modelBackend.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/twilight/config
              readOnly: true
            - name: models
              mountPath: /etc/twilight/models
              readOnly: true
            - name: secrets
              mountPath: /etc/twilight/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: twilight-config
            items:
              - key: model-backend.json
                path: model-backend.json
        - name: models
          configMap:
            name: twilight-models
        - name: secrets
          {{- if .Values.services.modelBackend.providerSecret }}
          projected:
            sources:
              - secret:
                  name: {{ include "twilight.secretName" . }}
              - secret:
                  name: {{ .Values.services.modelBackend.providerSecret | quote }}
                  items:
                    - key: REAL_MODEL_API_KEY
                      path: REAL_MODEL_API_KEY
          {{- else }}
          secret:
            secretName: {{ include "twilight.secretName" . }}
          {{- end }}
