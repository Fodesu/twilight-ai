{{- $existing := lookup "v1" "Secret" .Release.Namespace "grafana-admin" }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  username: {{ "admin" | b64enc | quote }}
{{- if and $existing $existing.data }}
  password: {{ index $existing.data "password" | quote }}
{{- else }}
  password: {{ randAlphaNum 48 | b64enc | quote }}
{{- end }}
