apiVersion: v1
kind: Service
metadata:
  name: mock-model
spec:
  selector:
    app.kubernetes.io/name: mock-model
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-model
        app.kubernetes.io/part-of: twilight-validation-mock
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        twilight.io/role: backend
      tolerations:
        - key: twilight.io/role
          operator: Equal
          value: backend
          effect: NoSchedule
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mock-model
          image: python:3.12.11-alpine
          command: [python, -B, -u, /app/mock_model.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: validation-mock-model
