[package]
name = "twilight-chat"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Event-driven Twilight terminal application"

[dependencies]
chat-protocol = { path = "crates/chat-protocol" }
chat-client = { path = "crates/chat-client" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
pulldown-cmark = "0.13"
ratatui = { version = "0.29", features = ["scrolling-regions"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Codex's Markdown adapter uses this Ratatui 0.29-compatible release.
tui-markdown = { version = "=0.3.3", default-features = false }
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4"] }
